name: Build & Package extstd (Shared)

on:
  push:
    branches: [ LIU ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ LIU ]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os_name }} (SHARED)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux-x64
          - runner: windows-latest
            os_name: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j

      - name: Install
        shell: bash
        run: cmake --install build --config Release

      - name: Package installed files
        shell: bash
        run: |
          mkdir -p dist
          PKG_NAME="extstd-${{ matrix.os_name }}-SHARED"
          if [[ "${{ matrix.runner }}" == windows-* ]]; then
            7z a -tzip "dist/${PKG_NAME}.zip" ./install/*
          else
            tar -czf "dist/${PKG_NAME}.tar.gz" -C install .
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: extstd-${{ matrix.os_name }}-SHARED
          path: dist/*

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
